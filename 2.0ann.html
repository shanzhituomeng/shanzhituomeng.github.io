
    <html>
    <head>
        <title>提示页面</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 添加 viewport meta -->
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #FF0000;  /* 背景全红色 */
                color: white;
                text-align: center;
                padding: 0;
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;  /* 使页面高度为视口高度 */
                width: 100%;    /* 确保宽度也覆盖屏幕 */
                box-sizing: border-box; /* 确保边距和填充不会影响大小 */
            }
            h2 {
                font-size: 2.5rem; /* 用 rem 单位来保证字体大小与屏幕尺寸的适配 */
                margin-bottom: 20px;
            }
            p {
                font-size: 1.2rem; /* 同样使用 rem 单位 */
                margin-bottom: 10px;
            }
            input[type="text"] {
                width: 80%;
                padding: 15px;
                font-size: 1rem;
                margin: 20px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            input[type="submit"] {
                padding: 15px 30px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 1rem;
                cursor: pointer;
                width: 100%;
            }
            input[type="submit"]:hover {
                background-color: #45a049;
            }
            .skip-button {
                padding: 15px 30px;
                background-color: #f44336;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 1rem;
                cursor: pointer;
                width: 100%;
                margin-top: 20px;
            }
            .skip-button:hover {
                background-color: #e53935;
            }
            /* 弹窗样式 */
            .error-popup {
                display: none;  /* 默认隐藏 */
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }
            .error-popup .popup-content {
                background: white;
                padding: 20px;
                border-radius: 10px;
                width: 300px;
                text-align: center;
            }
            .error-popup .close-btn {
                background-color: #f44336;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 10px;
            }
            .error-popup .close-btn:hover {
                background-color: #e53935;
            }
            /* 错误信息的样式 */
            .error {
                color: black; /* 黑色文字 */
                font-size: 1rem;
            }
            /* 响应式设计 */
            @media (max-width: 768px) {
                h2 {
                    font-size: 2rem;
                }
                p {
                    font-size: 1.4rem;
                }
                input[type="text"] {
                    width: 90%;
                    font-size: 1.2rem;
                    padding: 18px;
                }
                input[type="submit"], .skip-button {
                    font-size: 1.2rem;
                    padding: 18px 30px;
                }
            }
        </style>
    </head>
    <body>
        <div>
            <h2>重要提示，不看可能被锁机<br>⚠⚠⚠⚠⚠⚠⚠</h2>
            <p>· 共享ID为公用ID，只能登陆商店使用</p>
            <p>· 禁止登陆到设置里！否则可能会被坏人锁机并勒索！</p>
            <p>如果您已阅读以上内容，请在下方输入：</p>
            <p><strong>禁止登陆设置否则会被坏人锁机</strong></p>
            
            <form method="POST" action="">

                <input type="submit" value="我是新手，我已输入上面内容，确认👉">
